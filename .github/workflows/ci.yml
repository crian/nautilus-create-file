name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Check syntax
        run: python3 -m py_compile nautilus-create-file.py tests/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate PO files
        run: |
          for po in po/*.po; do
            msgfmt --check -o /dev/null "$po"
          done

      - name: Check that every message is translated
        run: |
          for po in po/*.po; do
            echo "Checking $po"
            msgcmp "$po" po/nautilus-create-file.pot
            if msgattrib --only-obsolete "$po" | grep -q '^msgid "'; then
              echo "::error file=$po::contains obsolete messages; run msgmerge"
              exit 1
            fi
          done

      - name: Check translation template
        run: |
          xgettext --from-code=UTF-8 -L Python -k_ -o "$RUNNER_TEMP/current.pot" nautilus-create-file.py
          msgcmp --use-untranslated "$RUNNER_TEMP/current.pot" po/nautilus-create-file.pot
          msgcmp --use-untranslated po/nautilus-create-file.pot "$RUNNER_TEMP/current.pot"
